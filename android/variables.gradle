ext {
    // 26 is Stripe Terminal's floor for the Android SDK to build at all.
    // Tap to Pay itself needs Android 13 (API 33) plus an NFC radio, which is a
    // RUNTIME check (src/lib/tap-to-pay-device.ts + the plugin's isSupported),
    // not a build one — raising minSdk to 33 would drop working phones from the
    // whole app to gate one feature most trainers will never use.
    minSdkVersion = 26
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    stripeTerminalVersion = '4.7.0'
}